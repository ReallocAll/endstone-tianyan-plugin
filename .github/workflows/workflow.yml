name: Manual Build and Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Prepared version (must match CMake and changelog)'
        required: false
        type: string
      dry_run:
        description: 'Build and validate without publishing'
        required: true
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  validated-release:
    uses: ./.github/workflows/nightly.yml
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
