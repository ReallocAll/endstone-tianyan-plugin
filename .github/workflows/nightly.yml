name: Build and Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Prepared version'
        type: string
        default: ''
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        default: true
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Prepared version (must match CMake and changelog)'
        required: false
        type: string
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        default: true
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      release_build: ${{ steps.meta.outputs.release_build }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 tools/release_metadata.py
  regression:
    uses: ./.github/workflows/ownership-tests.yml
  build:
    needs: prepare
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        run: rustup show

      # ===== WebUI Frontend Build (Vue 3 + Vite) =====
      - name: Setup Node.js
        uses: actions/setup-node@v5

      - name: Build WebUI frontend
        shell: bash
        run: |
          corepack enable
          cd WebUI-Next
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Verify frontend dist
        shell: bash
        run: |
          ls -lh WebUI-Next/dist/
          wc -c WebUI-Next/dist/index.html

      # ===== Linux =====
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common unzip zip
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          sudo apt-get install -y libc++-19-dev libc++abi-19-dev cmake libsqlite3-dev ninja-build

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DRELEASE_VERSION=${{ needs.prepare.outputs.release_build }} \
                -DCMAKE_C_COMPILER=clang-19 \
                -DCMAKE_CXX_COMPILER=clang++-19 \
                -DCMAKE_CXX_FLAGS="-stdlib=libc++"

      # ===== Windows =====
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Set up LLVM/Clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress

      - name: Set up CMake and Ninja
        if: runner.os == 'Windows'
        uses: lukka/get-cmake@latest

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install sqlite3:x64-windows-static zlib:x64-windows-static

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DRELEASE_VERSION=${{ needs.prepare.outputs.release_build }} `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static

      # ===== Build (only plugin target, skip fmt full build) =====
      - name: Build
        run: cmake --build build --config Release --target tianyan

      # ===== Package =====
      - name: Package plugin (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p package/tianyan_data/language
          if [ ! -f "build/endstone_tianyan.so" ]; then
            echo "No endstone_tianyan.so found!"
            exit 1
          fi
          cp build/endstone_tianyan.so package/endstone_tianyan.so
          cp -r language/* package/tianyan_data/language/
          cd package
          zip -r ../tianyan_nightly_linux.zip endstone_tianyan.so tianyan_data

      - name: Package plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/tianyan_data/language -Force
          Copy-Item build/endstone_tianyan.dll package/
          Copy-Item language/* package/tianyan_data/language/ -Recurse
          cd package
          Compress-Archive -Path endstone_tianyan.dll, tianyan_data -DestinationPath ../tianyan_nightly_windows.zip

      - name: Record resolved native dependencies
        shell: bash
        run: |
          {
            printf 'Plugin source: %s\n' "$GITHUB_SHA"
            rustc --version
            cmake --version | head -1
            find build -name .git -prune -print | sort | while read -r metadata; do
              repository="$(dirname "$metadata")"
              printf '%s %s\n' "$repository" "$(git -C "$repository" rev-parse HEAD)"
            done
            sha256sum rust_mysql/Cargo.lock WebUI-Next/pnpm-lock.yaml
          } > dependency-manifest-${{ runner.os }}.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-plugin-${{ runner.os }}
          path: |
            tianyan_nightly_*.zip
            build/endstone_tianyan.so
            build/endstone_tianyan.dll
            dependency-manifest-*.txt
          retention-days: 1


  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, regression]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-plugin-*
          merge-multiple: true
          path: artifacts
      - name: Prepare current-run release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release
          cp artifacts/dependency-manifest-*.txt release/
          cp artifacts/build/endstone_tianyan.so release/
          cp artifacts/build/endstone_tianyan.dll release/
          cp artifacts/tianyan_nightly_linux.zip "release/tianyan-$VERSION-linux.zip"
          cp artifacts/tianyan_nightly_windows.zip "release/tianyan-$VERSION-windows.zip"
          printf 'Source: %s\nBuild and regression run: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release/PROVENANCE.txt
          (cd release && sha256sum * > SHA256SUMS)
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          start = text.index('## [' + os.environ['VERSION'] + ']')
          start = text.index('\n', start) + 1
          end = text.find('\n## [', start)
          notes = (text[start:] if end < 0 else text[start:end]).strip()
          if not notes: raise SystemExit('Empty release notes')
          Path('/tmp/tianyan-release-notes.md').write_text(notes + '\n')
          PYNOTES
      - name: Tag and publish tested SHA without overwriting a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            test "$(git rev-list -n 1 "v$VERSION")" = "$GITHUB_SHA" || { echo 'Refusing to move existing tag'; exit 1; }
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/v$VERSION"
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Tianyan v$VERSION" --notes-file /tmp/tianyan-release-notes.md release/*
